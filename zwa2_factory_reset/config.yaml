name: ZWA-2 Factory Reset
version: "1.0.1"
slug: zwa2_factory_reset
description: Factory-reset a Home Assistant Connect ZWA-2 via the Gecko bootloader (works around the SetDefault firmware bug)
url: https://github.com/leoashcraft/zwa2-factory-reset
arch:
  - aarch64
  - amd64
  - armv7
startup: once
boot: manual
init: false
uart: true
hassio_api: true
hassio_role: manager
homeassistant_api: true
map:
  - share:rw
options:
  action: check
  confirm: false
  manage_zwave_js: true
  cleanup_ha_devices: false
  port: auto
  region: keep
  restore_file: ""
schema:
  action: list(check|wipe|restore|list)
  confirm: bool
  manage_zwave_js: bool
  cleanup_ha_devices: bool
  port: str
  region: str
  restore_file: str
